<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Tracker</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Jobs">
<meta name="theme-color" content="#f6f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161615" media="(prefers-color-scheme: dark)">
<style>
:root {
  --bg: #f6f6f3; --panel: #fff; --ink: #1d1d1b; --muted: #6b6b66; --faint: #9a9a94; --line: #e6e5df; --press: #efeee8;
  --accent: #2f5fd0; --accent-ink: #fff; --accent-soft: #e8eefc;
  --warn-bg: #fff3d6; --warn-ink: #7a5300; --bad-bg: #fde4e1; --bad-ink: #9b2a1c; --ok-bg: #dff3e4; --ok-ink: #1d6b35;
  --chip: #eeede7; --shadow: 0 6px 24px rgba(0,0,0,.12);
  --safe-b: env(safe-area-inset-bottom); --safe-t: env(safe-area-inset-top);
  --tabbar: calc(56px + var(--safe-b));
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --panel: #1f1f1d; --ink: #ecebe6; --muted: #a3a29b; --faint: #77766f; --line: #32312d; --press: #2a2a27;
    --accent: #7b9ef0; --accent-ink: #111; --accent-soft: #26314a;
    --warn-bg: #3d3112; --warn-ink: #f0c868; --bad-bg: #43201b; --bad-ink: #f29a8c; --ok-bg: #1b3a24; --ok-ink: #8fd6a3;
    --chip: #2c2c29; --shadow: 0 6px 24px rgba(0,0,0,.5);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, system-ui, "Segoe UI", "Noto Sans SC", sans-serif; overscroll-behavior-y: none; }
button, select, input, textarea { font: inherit; color: inherit; }
/* iOS Safari：输入框字号 < 16px 时，聚焦会自动放大页面，退出后也不缩回 */
select, input, textarea { font-size: 16px; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); text-decoration: none; }
svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* ── 顶栏 ── */
.top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(var(--safe-t) + 8px) 16px 8px; }
.top-row { display: flex; align-items: center; gap: 4px; }
.top h1 { font-size: 26px; margin: 0; flex: 1; letter-spacing: -.01em; }
.icon-btn { width: 40px; height: 40px; border-radius: 20px; display: grid; place-items: center; color: var(--ink); }
.icon-btn:active { background: var(--press); }
.icon-btn.dot { position: relative; }
.icon-btn.dot::after { content: ""; position: absolute; top: 9px; right: 9px; width: 8px; height: 8px; border-radius: 4px; background: #e5484d; }
.mail { display: block; border-top: 1px solid var(--line); padding: 10px 0; color: var(--ink); }
.mail:first-of-type { border-top: 0; padding-top: 0; }
.mail .s { font-weight: 600; }
.mail .sn { color: var(--muted); font-size: 13px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.search { display: flex; gap: 8px; margin-top: 8px; }
.search[hidden] { display: none; }
.search input { flex: 1; min-width: 0; border: 0; background: var(--chip); border-radius: 10px; padding: 9px 12px; outline: none; }
.search select { border: 0; background: var(--chip); border-radius: 10px; padding: 0 8px; }
.banner { margin: 0 16px 8px; padding: 10px 12px; border-radius: 12px; font-size: 13px; background: var(--bad-bg); color: var(--bad-ink); }
.banner[hidden] { display: none; }

/* ── 列表 ── */
main { min-height: 0; }
.list-pane { padding: 0 12px calc(var(--tabbar) + 16px); }
.ptr { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height .2s; }
.card { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: grid; gap: 4px; transition: transform .25s, opacity .25s; }
.card:active { background: var(--press); }
.card.sel { outline: 2px solid var(--accent); outline-offset: -2px; }
.card.gone { opacity: 0; transform: translateX(-30%); }
.card .t { font-weight: 600; font-size: 16px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card .co { color: var(--ink); font-size: 14px; }
.card .meta { color: var(--muted); font-size: 13px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.chip { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: var(--chip); color: var(--muted); white-space: nowrap; }
.chip.warn { background: var(--warn-bg); color: var(--warn-ink); }
.chip.bad { background: var(--bad-bg); color: var(--bad-ink); }
.chip.ok { background: var(--ok-bg); color: var(--ok-ink); }
.chip.st { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.empty { padding: 60px 20px; text-align: center; color: var(--muted); }
.empty b { display: block; font-size: 17px; color: var(--ink); margin-bottom: 4px; }

/* ── 底部标签栏 ── */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: var(--tabbar); padding-bottom: var(--safe-b);
  display: flex; background: color-mix(in srgb, var(--panel) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11px; color: var(--faint); }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--accent); }
.tabbar .n { font-variant-numeric: tabular-nums; }

/* ── 详情（手机：全屏滑入） ── */
.detail { position: fixed; inset: 0; z-index: 40; background: var(--bg); transform: translateX(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.detail.open { transform: none; }
.d-head { display: flex; align-items: center; gap: 4px; padding: calc(var(--safe-t) + 6px) 8px 6px; background: var(--bg); }
.d-head .ttl { flex: 1; font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0; transition: opacity .15s; }
.d-head.scrolled .ttl { opacity: 1; }
.d-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 16px calc(96px + var(--safe-b)); }
.d-body h2 { font-size: 22px; line-height: 1.25; margin: 4px 0 6px; }
.d-sub { color: var(--muted); }
.facts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
.fact { background: var(--panel); border-radius: 12px; padding: 10px 12px; }
.fact .k { font-size: 12px; color: var(--muted); }
.fact .v { font-weight: 600; }
.sec { background: var(--panel); border-radius: 14px; padding: 12px 14px; margin-top: 12px; }
.sec h3 { font-size: 13px; color: var(--muted); font-weight: 600; margin: 0 0 8px; display: flex; align-items: center; justify-content: space-between; }
.sec.warn { background: var(--warn-bg); color: var(--warn-ink); }
.links { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.link-btn { display: flex; align-items: center; gap: 10px; background: var(--panel); border-radius: 12px; padding: 12px 14px; color: var(--ink); }
.link-btn .src { font-weight: 600; }
.link-btn .sm { color: var(--muted); font-size: 13px; flex: 1; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-btn svg { color: var(--accent); width: 18px; height: 18px; }
.jd { white-space: pre-wrap; font-size: 14.5px; line-height: 1.55; max-height: 280px; overflow: hidden; position: relative; }
.jd::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(transparent, var(--panel)); }
.jd.open { max-height: none; }
.jd.open::after { display: none; }
.text-btn { color: var(--accent); font-weight: 600; padding: 8px 0 0; }
textarea, .field { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px; outline: none; resize: vertical; }
textarea:focus, .field:focus { border-color: var(--accent); }
.qa { border-top: 1px solid var(--line); padding: 10px 0; }
.qa:first-child { border-top: 0; padding-top: 0; }
.qa .q { font-weight: 600; }
.qa .a { white-space: pre-wrap; }
.qa .x { float: right; color: var(--faint); padding: 0 4px; }
.timeline { list-style: none; padding: 0; margin: 0; font-size: 13.5px; }
.timeline li { display: flex; gap: 10px; padding: 5px 0; }
.timeline .when { color: var(--muted); min-width: 96px; font-variant-numeric: tabular-nums; }
.row-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn { border-radius: 10px; padding: 9px 14px; background: var(--chip); font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn:active { opacity: .7; }

/* 详情底部操作栏 */
.actions { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + var(--safe-b)); display: flex; gap: 8px;
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-top: 1px solid var(--line); }
.actions button { flex: 1; height: 46px; border-radius: 12px; background: var(--panel); font-weight: 600; font-size: 15px; }
.actions button.primary { background: var(--accent); color: var(--accent-ink); }
.actions button.on { outline: 2px solid var(--accent); color: var(--accent); }
.actions button.more { flex: 0 0 46px; display: grid; place-items: center; }
.actions button:active { opacity: .7; }

/* ── 底部弹层 / 提示 ── */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: var(--panel); border-radius: 18px 18px 0 0; padding: 8px 16px calc(16px + var(--safe-b));
  transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow); }
.sheet.open { transform: none; }
.sheet .grab { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet h4 { margin: 0 0 4px; font-size: 17px; }
.sheet p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
.sheet-list button { display: flex; width: 100%; align-items: center; justify-content: space-between; padding: 14px 4px; border-top: 1px solid var(--line); font-size: 16px; }
.sheet-list button:first-child { border-top: 0; }
.sheet-list button.on { color: var(--accent); font-weight: 600; }
.sheet-list .sm { color: var(--muted); font-size: 13px; }
.toast { position: fixed; left: 12px; right: 12px; bottom: calc(var(--tabbar) + 12px); z-index: 60; background: #222; color: #fff; border-radius: 14px; padding: 12px 14px;
  display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); transform: translateY(20px); opacity: 0; pointer-events: none; transition: all .2s; }
.toast.show { transform: none; opacity: 1; pointer-events: auto; }
.toast .msg { flex: 1; }
.toast button { color: #8fb0ff; font-weight: 700; }
.detail-open .toast { bottom: calc(80px + var(--safe-b)); }

/* ── 电脑：两栏 ── */
@media (min-width: 900px) {
  body { height: 100vh; overflow: hidden; }
  #app { display: grid; grid-template-rows: auto auto 1fr; height: 100vh; }
  .top { position: static; display: flex; align-items: center; gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); }
  .top-row { flex: 1; }
  .top h1 { font-size: 20px; flex: 0 0 auto; margin-right: 12px; }
  .search { margin: 0; width: 360px; }
  .search[hidden] { display: flex; }
  #searchToggle { display: none; }
  .tabbar { position: static; height: auto; padding: 0; border: 0; background: none; backdrop-filter: none; flex: 0 0 auto; gap: 4px; }
  .tabbar button { flex-direction: row; font-size: 14px; padding: 6px 10px; border-radius: 8px; gap: 6px; color: var(--muted); }
  .tabbar button svg { display: none; }
  .tabbar button.on { background: var(--accent-soft); }
  .banner { margin: 8px 20px 0; }
  main { display: grid; grid-template-columns: minmax(360px, 1fr) minmax(460px, 1.3fr); overflow: hidden; }
  .list-pane { overflow-y: auto; padding: 12px; border-right: 1px solid var(--line); }
  /* min-height:0：grid / flex 子项默认会被内容撑高，JD 长时操作栏会被挤出屏幕 */
  .detail { position: relative; inset: auto; transform: none; z-index: 1; min-height: 0; }
  .d-body { min-height: 0; }
  .d-head .back { display: none; }
  .d-head .ttl { opacity: 1; padding-left: 8px; }
  .actions { position: absolute; }
  .toast { left: auto; right: 24px; width: 380px; bottom: 24px; }
  .detail-open .toast { bottom: 24px; }
  .sheet { left: 50%; right: auto; width: 440px; transform: translate(-50%, calc(100% + 48px)); border-radius: 18px; bottom: 24px; }  /* 要多移 bottom + 阴影的距离，否则矮的弹层会露出一截 */
  .sheet.open { transform: translate(-50%, 0); }
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <h1 id="viewTitle">待处理</h1>
      <button class="icon-btn" id="searchToggle" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
      <button class="icon-btn" id="refreshBtn" aria-label="刷新"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="icon-btn" id="menuBtn" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg></button>
    </div>
    <div class="search" id="searchBar" hidden>
      <input id="q" type="search" placeholder="搜索当前页：标题 / 公司 / JD" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <select id="source" aria-label="平台"><option value="">全部</option><option value="seek">SEEK</option><option value="linkedin">LinkedIn</option></select>
    </div>
    <nav class="tabbar" id="tabbar"></nav>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main>
    <section class="list-pane" id="listPane">
      <div class="ptr" id="ptr">下拉刷新</div>
      <div id="list"></div>
    </section>
    <section class="detail" id="detail" aria-hidden="true">
      <div class="d-head" id="dHead">
        <button class="icon-btn back" id="backBtn" aria-label="返回"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="ttl" id="dTitle"></div>
      </div>
      <div class="d-body" id="dBody"><div class="empty">选一个职位</div></div>
      <div class="actions" id="actions" hidden></div>
    </section>
  </main>
  <div class="scrim" id="scrim"></div>
  <div class="sheet" id="sheet"></div>
  <div class="toast" id="toast"><span class="msg"></span><button hidden></button></div>
</div>
<script>
const STATUS = { new: '新', shortlisted: '想投', skipped: '不投', applied: '已投', assessment: '笔试/测评', interview: '面试', rejected: '被拒', offer: 'Offer', closed: '已关闭' };
const RULE = { crowdwork_company: '众包/标注', crowdwork_title: '标注类职位', crowdwork_jd: 'AI 训练零工', outsourcing: 'IT 外包', seniority: '职级过高', phd: 'PhD',
               agency: '中介', agency_low_priority: '低优先级中介', visa: '身份要求', visa_note: '工作权限',
               intern: '实习', off_stack: '技术栈不对口', stack_match: '技术栈匹配' };
const SRC = { seek: 'SEEK', linkedin: 'LinkedIn', email: 'Gmail' };   // email：搜不到职位帖子，按邮件建的职位
const MAIL = { applied: '已投递确认', viewed: '对方已查看', rejected: '被拒', assessment: '笔试/测评', interview: '面试邀请', offer: 'Offer', closed: '职位已关闭', other: '其他' };
const MAIL_CLS = { rejected: 'bad', interview: 'ok', offer: 'ok', assessment: 'warn' };
const gmailUrl = t => `https://mail.google.com/mail/u/0/#all/${encodeURIComponent(t)}`;
const ICON = {
  active: '<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>',
  pipeline: '<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  closed: '<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  filtered: '<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>',
  ext: '<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
  more: '<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
};
const VIEWS = [['active', '待处理'], ['pipeline', '进行中'], ['closed', '已结束'], ['filtered', '已过滤']];
const TITLES = { ...Object.fromEntries([['active', '待处理'], ['pipeline', '进行中'], ['closed', '已结束'], ['filtered', '已过滤']]), all: '全部职位' };
const VIEW_OF = s => ['new', 'shortlisted'].includes(s) ? 'active' : ['applied', 'assessment', 'interview', 'offer'].includes(s) ? 'pipeline' : 'closed';
// 每个状态下底部操作栏的主要按钮（其余放进"更多"）
const PRIMARY = {
  new: ['shortlisted', 'skipped', 'applied'], shortlisted: ['skipped', 'applied'],
  applied: ['assessment', 'interview', 'rejected'], assessment: ['interview', 'rejected'], interview: ['offer', 'rejected'],
  offer: ['rejected'], skipped: ['new'], rejected: ['new'], closed: ['new'],
};
const ACTION_LABEL = { ...STATUS, new: '重新打开' };

const state = { view: lsGet('view') || 'active', q: '', source: '', sel: null, job: null, jobs: [], summary: null };
const isDesktop = () => matchMedia('(min-width: 900px)').matches;
function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { toast(d.error || `出错了（${r.status}）`); throw new Error(d.error); }
  return d;
}
function ago(ts) {
  if (!ts) return '';
  const m = (Date.now() - new Date(ts)) / 60000;
  if (m < 60) return `${Math.max(1, Math.round(m))} 分钟前`;
  if (m < 1440) return `${Math.round(m / 60)} 小时前`;
  return `${Math.round(m / 1440)} 天前`;
}
const fmt = ts => ts ? new Date(ts).toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
function tagChips(tags) {
  const seen = new Set();
  return tags.filter(t => !seen.has(t.rule) && seen.add(t.rule)).map(t =>
    `<span class="chip ${t.action === 'reject' ? 'bad' : t.action === 'soft' ? 'warn' : t.action === 'boost' ? 'ok' : ''}">${esc(RULE[t.rule] || t.rule)}${t.rule === 'stack_match' ? ': ' + esc(t.reason) : ''}</span>`).join('');
}

// ── 提示 ──
let toastTimer;
function toast(msg, actionLabel, onAction) {
  const el = $('toast'), btn = el.querySelector('button');
  el.querySelector('.msg').textContent = msg;
  btn.hidden = !actionLabel;
  btn.textContent = actionLabel || '';
  btn.onclick = () => { el.classList.remove('show'); onAction && onAction(); };
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), actionLabel ? 5000 : 2500);
}

// ── 底部弹层 ──
function openSheet(html) {
  $('sheet').innerHTML = '<div class="grab"></div>' + html;
  $('sheet').classList.add('open'); $('scrim').classList.add('open');
}
function closeSheet() { $('sheet').classList.remove('open'); $('scrim').classList.remove('open'); }
$('scrim').addEventListener('click', closeSheet);

// ── 数据 ──
async function loadSummary() {
  const s = state.summary = await api('/api/summary');
  $('tabbar').innerHTML = VIEWS.map(([v, l]) =>
    `<button data-view="${v}" class="${v === state.view ? 'on' : ''}">${ICON[v]}<span>${l} <span class="n">${s.views[v] ?? 0}</span></span></button>`).join('');
  $('menuBtn').classList.toggle('dot', !!s.unmatched_emails);
  const errs = s.runs.filter(r => r.error);
  $('banner').hidden = !errs.length;

async function loadList() {

  renderList();
}
function renderList() {
  if (!state.jobs.length) {
    const hint = state.q ? `「${TITLES[state.view]}」里没有，换个关键词或切到别的页看看` : state.view === 'active' ? '新职位来了会推送提醒你' : '';
    $('list').innerHTML = `<div class="empty"><b>${state.q ? '没有找到' : '这里没有职位'}</b>${hint}</div>`;
    return;

  $('list').innerHTML = state.jobs.map(j => {
    const srcs = [...new Set(j.postings.map(p => SRC[p.source]))].join(' + ');

// ── 详情 ──
async function openJob(id) {
  state.sel = id;
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', Number(c.dataset.id) === id));
  const d = await api('/api/jobs/' + id);
  renderDetail(d);
  $('detail').classList.add('open'); $('detail').setAttribute('aria-hidden', 'false');
  document.body.classList.add('detail-open');
  if (!isDesktop() && history.state?.detail !== id) history.pushState({ detail: id }, '');
}
function closeDetail(fromPop) {
  $('detail').classList.remove('open'); $('detail').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('detail-open');
  if (!fromPop && !isDesktop() && history.state?.detail) history.back();
  if (!isDesktop()) { state.sel = null; document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel')); }

async function saveNotes() {

// ── 改状态：提示 + 撤销 + 移出当前列表就回到列表 ──
async function setStatus(status, opts = {}) {
  const id = state.sel, prev = state.job.job.status;
  if (status === prev) return;
  const d = await api(`/api/jobs/${id}/status`, { status, detail: opts.detail });
  const leaves = !['filtered', 'all'].includes(state.view) && VIEW_OF(status) !== state.view;
  if (leaves) {
    const card = document.querySelector(`.card[data-id="${id}"]`);
    if (card) card.classList.add('gone');
  }
  if (leaves && !isDesktop() && !opts.stay) closeDetail();
  else renderDetail(d, true);
  setTimeout(() => { loadSummary(); loadList(); }, leaves ? 250 : 0);
  if (opts.silent) return;
  const where = leaves ? `，已移到「${TITLES[VIEW_OF(status)]}」` : '';
  toast(`已标记为「${STATUS[status]}」${where}`, '撤销', async () => {
    await api(`/api/jobs/${id}/status`, { status: prev, detail: '撤销' });
    await Promise.all([loadSummary(), loadList()]);
    if (state.sel === id || isDesktop()) openJob(id);
    toast(`已恢复为「${STATUS[prev]}」`);
  });
  if (status === 'applied' && !opts.noQa) qaSheet(id, true);
}

function moreSheet() {
  const cur = state.job.job.status;
  openSheet(`<h4>改状态</h4><p>当前：${STATUS[cur]}</p><div class="sheet-list">${Object.entries(STATUS).map(([k, l]) =>
    `<button data-sheet-status="${k}" class="${k === cur ? 'on' : ''}"><span>${l}</span><span class="sm">${VIEW_OF(k) === 'active' ? '待处理' : VIEW_OF(k) === 'pipeline' ? '进行中' : '已结束'}</span></button>`).join('')}</div>`);
}

async function pickJobSheet(mailId, q) {
  openSheet(`<h4>关联到哪个职位？</h4><input class="field" id="pick-q" placeholder="搜索职位 / 公司" value="${esc(q)}" style="margin-bottom:8px">
    <div class="sheet-list" id="pick-list"></div>`);

// ── 事件 ──
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-view],[data-id],[data-status],[data-act],[data-dup],[data-delqa],[data-open],[data-sheet-status],[data-qa-save],[data-mail-link],[data-mail-ignore],[data-pick-job]');
  if (!t) return;
  if (t.dataset.view) {
    state.view = t.dataset.view; lsSet('view', state.view);
    // 切页时保留搜索词：在新的页里接着搜
    if (!isDesktop()) closeDetail();
    window.scrollTo({ top: 0 });
    await loadSummary(); return loadList();
  }
  if (t.dataset.id) return openJob(Number(t.dataset.id));
  if (t.dataset.open) { e.preventDefault(); return openJob(Number(t.dataset.open)); }
  if (t.dataset.status) return setStatus(t.dataset.status);
  if (t.dataset.mailLink) return pickJobSheet(t.dataset.mailLink, t.dataset.q || '');
  if (t.dataset.mailIgnore) { await api(`/api/emails/${t.dataset.mailIgnore}/ignore`, {}); await loadSummary(); await mailsSheet(true); toast('已忽略'); return; }
  if (t.dataset.pickJob) {
    const r = await api(`/api/emails/${t.dataset.mail}/link`, { job_id: Number(t.dataset.pickJob) });
    await Promise.all([loadSummary(), loadList()]);
    await mailsSheet(true);
    toast(r.status ? `已关联，状态更新为「${STATUS[r.status]}」` : '已关联');
    return;
  }
  if (t.dataset.sheetStatus) { closeSheet(); return setStatus(t.dataset.sheetStatus); }
  if (t.dataset.qaSave) {
    const question = $('qa-q').value.trim(), answer = $('qa-a').value.trim();
    if (!answer) { toast('先写点内容'); return; }
    const d = await api(`/api/jobs/${t.dataset.qaSave}/qa`, { question, answer });
    closeSheet();
    if (state.sel === Number(t.dataset.qaSave)) renderDetail(d, true);
    toast('问答已保存');
    return;
  }
  if (t.dataset.delqa) {
    if (!confirm('删除这条问答？')) return;
    await api(`/api/qa/${t.dataset.delqa}/delete`, {});
    return renderDetail(await api('/api/jobs/' + state.sel), true);
  }
  if (t.dataset.dup) {
    const r = await api('/api/dups', { a: state.sel, b: t.dataset.b, action: t.dataset.dup, keep: state.sel });
    toast(t.dataset.dup === 'merge' ? '已合并' : '已标记为不是同一个');
    await Promise.all([loadSummary(), loadList()]);
    return renderDetail(await api('/api/jobs/' + (r.job || state.sel)), true);
  }
  switch (t.dataset.act) {
    case 'more': return moreSheet();
    case 'sheet-close': return closeSheet();
    case 'qa-open': return qaSheet(state.sel, false);
    case 'jd': { const jd = $('jd'); jd.classList.toggle('open'); t.textContent = jd.classList.contains('open') ? '收起' : '展开全部'; return; }
    case 'override': {
      const d = await api(`/api/jobs/${state.sel}/override`, { value: Number(t.dataset.v) });
      renderDetail(d, true); toast(Number(t.dataset.v) ? '已放行，移到待处理' : '已取消放行');
      return Promise.all([loadSummary(), loadList()]);
    }
    case 'go-all': closeSheet(); state.view = 'all'; await loadSummary(); return loadList();
    case 'push': return pushAction();
    case 'mails': return mailsSheet();
  }
});

async function refreshAll(withDetail = true) {

    try { renderDetail(await api('/api/jobs/' + state.sel), true); } catch { closeDetail(); }
  }

$('refreshBtn').addEventListener('click', async () => { await refreshAll(); toast('已刷新'); });
let lastRefresh = Date.now();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && Date.now() - lastRefresh > 5000) { lastRefresh = Date.now(); refreshAll(); }
});
window.addEventListener('pageshow', e => { if (e.persisted) refreshAll(); });
setInterval(() => {
  const typing = ['TEXTAREA', 'INPUT'].includes(document.activeElement?.tagName);

}, 60000);
// 下拉刷新（手机）
(() => {
  let y0 = null, dy = 0;
  addEventListener('touchstart', e => { if (!isDesktop() && scrollY <= 0 && !$('detail').classList.contains('open') && !$('sheet').classList.contains('open')) { y0 = e.touches[0].clientY; dy = 0; } }, { passive: true });
  addEventListener('touchmove', e => {
    if (y0 == null) return;
    dy = e.touches[0].clientY - y0;
    if (dy > 0) { $('ptr').style.transition = 'none'; $('ptr').style.height = Math.min(dy * .5, 60) + 'px'; $('ptr').textContent = dy > 120 ? '松开刷新' : '下拉刷新'; }
  }, { passive: true });
  addEventListener('touchend', async () => {
    if (y0 == null) return;
    const go = dy > 120; y0 = null;
    $('ptr').style.transition = '';
    if (go) { $('ptr').style.height = '40px'; $('ptr').textContent = '刷新中…'; await refreshAll(); }
    $('ptr').style.height = '0';
  });
})();

// ── 通知（Web Push）──
// iPhone 只有"添加到主屏幕"后从图标打开才能开通知；Android Chrome 直接可以。
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const pushOK = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
let pushSub = null;
const b64ToU8 = s => Uint8Array.from(atob((s + '='.repeat((4 - s.length % 4) % 4)).replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const pushLabel = () => !pushOK ? '开启通知' : pushSub ? '发送测试通知' : '开启通知';
const pushHint = () => !pushOK ? (isIOS && !standalone ? '需先添加到主屏幕' : '此浏览器不支持') : pushSub ? '已开启' : '新职位推送到手机';
async function refreshPushState() {
  if (!pushOK) return;
  try { const reg = await navigator.serviceWorker.ready; pushSub = Notification.permission === 'granted' ? await reg.pushManager.getSubscription() : null; } catch {}
}
async function pushAction() {
  if (!pushOK) {
    if (isIOS && !standalone) alert('iPhone 上要先：Safari 底部分享按钮 → 添加到主屏幕，再从主屏幕的 Jobs 图标打开，然后在这里开启通知。');
    else toast('这个浏览器不支持推送通知');
    return;
  }
  if (pushSub) { const r = await api('/api/push/test', {}); closeSheet(); toast(r.ok ? `测试通知已发送（${r.ok}/${r.total} 台设备）` : '发送失败，试试重新开启通知'); return; }
  const perm = await Notification.requestPermission();   // 必须在点击里调用
  if (perm !== 'granted') { toast('没有获得通知权限，可在 设置 → 通知 → Jobs 里打开'); return; }
  const { key } = await api('/api/push/key');
  const reg = await navigator.serviceWorker.ready;
  pushSub = (await reg.pushManager.getSubscription()) || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(key) });
  await api('/api/push/subscribe', pushSub.toJSON());
  closeSheet(); toast('通知已开启');
}
if (pushOK) navigator.serviceWorker.register('/sw.js').then(refreshPushState).catch(e => console.warn('sw', e));

// ── 启动 ──
(async () => {
  await Promise.all([loadSummary(), loadList()]);
  const deepJob = Number(new URLSearchParams(location.search).get('job'));   // 从通知点进来：/?job=123
  if (deepJob) { history.replaceState(null, '', '/'); openJob(deepJob); }
  else if (isDesktop() && state.jobs[0]) openJob(state.jobs[0].id);
})();
</script>
